apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: tms-utkast-frontend-pr-{{ pr }}
  namespace: min-side
  labels:
    team: min-side
spec:
  ttl: 72h
  idporten:
    enabled: true
    sidecar:
      enabled: true
      level: Level3
  tokenx:
    enabled: true
  image: {{ image }}
  port: 3000
  liveness:
    path: /minside/utkast/api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /minside/utkast/api/internal/isReady
    initialDelay: 10
  replicas:
    min: 1
    max: 1
  accessPolicy:
    outbound:
      rules:
        - application: tms-utkast
        - application: nav-dekoratoren
          namespace: personbruker
  ingresses:
    - "https://tms-utkast-frontend-pr-{{ pr }}.ansatt.dev.nav.no/minside/utkast"
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: "20m"
      memory: 128Mi
  env:
    - name: UTKAST_API_URL
      value: "http://tms-utkast/v3/utkast"
    - name: MIN_SIDE_URL
      value: "https://www.ansatt.dev.nav.no/minside/"
