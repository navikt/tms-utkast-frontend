name: "Deploy main"
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
  schedule:
    # Every monday at 07:00 UTC. Rebuilds and redeploys to pick up the latest base image.
    - cron: "0 7 * * 1"

permissions:
  contents: "read"
  id-token: "write"
  packages: "write"

jobs:
  ci:
    uses: navikt/tms-deploy/.github/workflows/astro-deploy-v1.yaml@main
    with:
      app-name: "tms-utkast-frontend"
      clusters: '["dev-gcp", "prod-gcp"]'
    secrets: inherit
